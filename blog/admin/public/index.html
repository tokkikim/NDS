<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공부노트 관리</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📘%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <strong class="brand">공부노트 관리</strong>
      <nav id="tabs">
        <button data-tab="today">오늘</button>
        <button data-tab="calendar">달력</button>
        <button data-tab="curriculum">커리큘럼</button>
        <button data-tab="posts">글</button>
        <button data-tab="research">시장분석</button>
        <button data-tab="settings">설정</button>
      </nav>
    </header>

    <main id="view"></main>

    <aside id="jobs" class="jobs" hidden></aside>

    <dialog id="modal">
      <div class="modal-head">
        <strong id="modal-title"></strong>
        <button class="ghost" onclick="document.getElementById('modal').close()">닫기</button>
      </div>
      <div id="modal-body"></div>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
